<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GK Clip Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0c1613; --panel:#12201b; --panel2:#182a23; --line:#27392f; --line2:#1e2f27;
  --text:#e8eee9; --muted:#8ea398; --chalk:#f2f0e4; --chalk-ink:#10201a; --bad:#ec6a57; --good:#4fc78d;
  --display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --ar:1.7778;
}
html,body{background:var(--bg)}
body{color:var(--text);font:14px/1.45 var(--sans);padding-inline:16px;padding-block:12px 28px}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{font:700 28px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.brand span{color:var(--muted);font-weight:600}
.vname{flex:1 1 200px;min-width:0;color:var(--muted);font:400 13px var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:5px;border:1px solid var(--line);background:var(--panel2);font-weight:500;white-space:nowrap}
.btn:hover{border-color:#456253;background:#1d3229}
.btn.primary{background:var(--chalk);color:var(--chalk-ink);border-color:var(--chalk)}
.btn.primary:hover{background:#fff}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.warn{border-color:var(--bad);color:var(--bad)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input[type=file]{display:none}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 0}
.tools{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tool{position:relative;display:inline-flex;align-items:center;gap:7px;padding:7px 11px;background:var(--panel2);border:0;border-right:1px solid var(--line);font-weight:500;font-size:13px}
.tool:last-child{border-right:0}
.tool:hover{background:#1d3229}
.tool[aria-pressed="true"]{background:var(--chalk);color:var(--chalk-ink)}
.tool kbd{font:500 10px var(--mono);opacity:.6}
.grp{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);white-space:nowrap}
.swatch{width:20px;height:20px;border-radius:50%;border:2px solid var(--bg);outline:1px solid var(--line);padding:0;background:var(--c)}
.swatch[aria-pressed="true"]{outline:2px solid var(--chalk)}
input[type=range]{accent-color:var(--chalk);width:110px}
.field{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 8px;min-width:0}
label.chk{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
input[type=checkbox]{accent-color:var(--chalk);width:15px;height:15px}

.desk{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1040px){.desk{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.screen{position:relative;width:min(100%,calc(66vh * var(--ar)));aspect-ratio:var(--ar);margin-inline:auto;background:#050a08;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050a08}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.screen.drop{outline:2px dashed var(--chalk);outline-offset:-6px}
.demo-tag{position:absolute;left:10px;bottom:10px;padding:4px 10px;border-radius:4px;background:rgba(12,22,19,.85);border:1px solid var(--line);font:500 12px var(--mono);pointer-events:none}
.hint-tag{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:4px;background:var(--chalk);color:var(--chalk-ink);font:500 12px var(--mono);pointer-events:none}

.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:10px}
.tp{display:flex;gap:6px;align-items:center}
.time{font:500 15px var(--mono);font-variant-numeric:tabular-nums;min-width:150px}
.time small{color:var(--muted);font-weight:400}
.spacer{flex:1 1 10px}

.tl{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tl-scroll{max-height:200px;overflow-y:auto}
.tl-grid{display:grid;grid-template-columns:120px minmax(0,1fr);gap:0 10px;padding:0 12px 6px}
.tl-lbls{display:grid;grid-auto-rows:26px;row-gap:3px;padding-top:0}
.tl-lbls div{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.tl-lbls div.sel{color:var(--text)}
.tl-lbls .lb{height:24px;cursor:default}
.trks{position:relative;cursor:ew-resize;touch-action:none}
.ruler{position:relative;height:24px;border-bottom:1px solid var(--line);margin-bottom:3px}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font:400 10px var(--mono);color:var(--muted);padding:6px 0 0 4px;pointer-events:none;white-space:nowrap}
.io{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.45);pointer-events:none;z-index:2}
.flag{position:absolute;top:0;width:2px;height:24px;background:var(--chalk);z-index:3;pointer-events:none}
.rows{display:grid;grid-auto-rows:26px;row-gap:3px}
.row{position:relative;background:var(--line2);border-radius:3px}
.bar{position:absolute;top:2px;bottom:2px;min-width:8px;border-radius:3px;background:color-mix(in srgb,var(--c) 32%,#12201b);border:1px solid var(--c);cursor:grab;overflow:hidden;display:flex;align-items:center;padding-left:8px;font-size:11px;white-space:nowrap;color:var(--text)}
.bar.sel{background:color-mix(in srgb,var(--c) 55%,#12201b);outline:2px solid var(--chalk);z-index:2}
.bar .h{position:absolute;top:0;bottom:0;width:7px;cursor:ew-resize}
.bar .h.l{left:0}.bar .h.r{right:0}
.bar .kf{position:absolute;top:50%;width:7px;height:7px;margin:-3px 0 0 -3px;background:var(--chalk);transform:rotate(45deg);pointer-events:none}
.playhead{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--chalk);pointer-events:none;z-index:5;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.tl-empty{padding:14px 12px;color:var(--muted);font-size:13px}

.side{position:sticky;top:env(safe-area-inset-top,0px);display:flex;flex-direction:column;max-height:calc(100vh - 20px);min-height:380px;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
@media (max-width:1040px){.side{position:static;max-height:none}}
.pane{padding:12px;overflow:auto;flex:1;min-height:0;display:grid;gap:14px;align-content:start}
h3{margin:0 0 8px;font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.hint{color:var(--muted);font-size:13px;margin:0;text-wrap:pretty}
.frm{display:grid;gap:10px}
.fr{display:grid;gap:4px}
.fr>label,.fr>span.l{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#pane textarea.field,#pane input.field,#pane select.field{width:100%}
textarea.field{min-height:84px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chk-list{display:grid;gap:6px}
.layers{display:grid;gap:4px}
.layer{display:flex;align-items:center;gap:8px;padding:6px 8px;background:var(--bg);border:1px solid var(--line2);border-radius:5px;text-align:left;width:100%}
.layer.sel{border-color:var(--chalk)}
.layer .sw{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.layer .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.layer .t{font:400 11px var(--mono);color:var(--muted)}
.tipbox{padding:10px 12px;border:1px dashed #4b6558;border-radius:6px;color:var(--muted);font-size:13px}
.tipbox b{color:var(--text);font-weight:600}
kbd{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;border:1px solid #3d5548;border-bottom-width:2px;border-radius:4px;background:var(--bg);font:500 11px var(--mono);color:var(--text)}

.modal{position:fixed;inset:0;background:rgba(3,8,6,.72);display:grid;place-items:center;padding:16px;z-index:40}
.dlg{width:min(680px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:grid;gap:14px}
.dlg>div:last-child{display:grid;gap:20px}
.dlg-h{display:flex;justify-content:space-between;align-items:center}
.dlg-h h2{margin:0;font:700 22px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
.dlg video,.dlg img{width:100%;border-radius:6px;background:#000;border:1px solid var(--line)}
.prog{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--chalk)}
.dlg textarea{width:100%;min-height:74px;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:8px;font:400 12px/1.5 var(--mono)}
.stat{font-size:13px;color:var(--muted);margin:0}
.stat.err{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);padding:9px 14px;background:var(--chalk);color:var(--chalk-ink);border-radius:6px;font-weight:500;box-shadow:0 6px 24px rgba(0,0,0,.45);z-index:60}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">GK Clip <span>Studio</span></div>
    <div class="vname" id="vname"></div>
    <div class="actions">
      <label class="btn primary" for="file" id="load-btn"></label>
      <input type="file" id="file" accept="video/*">
      <button class="btn" id="b-undo" type="button" title="Undo (Ctrl/Cmd+Z)"></button>
      <button class="btn" id="b-redo" type="button" title="Redo (Shift+Ctrl/Cmd+Z)"></button>
      <button class="btn" id="b-snap" type="button"></button>
      <button class="btn primary" id="b-export" type="button"></button>
    </div>
  </header>

  <div class="toolbar" id="toolbar"></div>

  <main class="desk">
    <section class="stage">
      <div class="screen" id="screen">
        <video id="vid" playsinline preload="auto"></video>
        <canvas id="cv"></canvas>
        <div class="hint-tag" id="hint-tag" hidden></div>
        <div class="demo-tag" id="demo-tag" hidden>Demo scene · load a video to annotate your own footage</div>
      </div>
      <div class="transport" id="transport"></div>
      <div class="tl" id="tl">
        <div class="tl-scroll"><div class="tl-grid">
          <div class="tl-lbls" id="tl-lbls"></div>
          <div class="trks" id="trks"><div class="ruler" id="ruler"></div><div class="rows" id="rows"></div><div class="playhead" id="playhead"></div></div>
        </div></div>
      </div>
    </section>
    <aside class="side" aria-label="Inspector"><div class="pane" id="pane"></div></aside>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="dlg" role="dialog" aria-modal="true"><div class="dlg-h"><h2 id="dlg-t"></h2><button class="btn sm" id="dlg-x" type="button">Close</button></div><div id="dlg-b"></div></div></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function pad2(n){return n<10?'0'+n:''+n}
function fmt(t){t=Math.max(0,t);var m=Math.floor(t/60),s=t-m*60;return m+':'+(s<10?'0':'')+s.toFixed(2)}
var toastT=null;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},2800)}

/* ---------- tools ---------- */
var IC={
 select:'<path d="M5 3l13 7-6 2-2 6z"/>',arrow:'<path d="M4 20 19 5M9 5h10v10"/>',line:'<circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/><path d="M6.5 17.5 17.5 6.5"/>',
 pen:'<path d="M4 20l1-4L16 5l3 3L8 19z"/>',ring:'<circle cx="12" cy="12" r="8"/>',spot:'<path d="M3 4h18v16H3z"/><circle cx="12" cy="12" r="4.5"/>',
 beam:'<path d="M9 3h6l-1 18h-4z"/>',angle:'<path d="M4 19h16M4 19 15 5"/><path d="M11 19a7 7 0 0 0-2-5"/>',text:'<path d="M5 6V4h14v2M12 4v16M9 20h6"/>',
 play:'<path d="M7 4.5v15l12-7.5z" style="fill:currentColor;stroke:none"/>',pause:'<path d="M7 4h4v16H7zM13 4h4v16h-4z" style="fill:currentColor;stroke:none"/>',
 prev:'<path d="M15 5 8 12l7 7"/>',next:'<path d="M9 5l7 7-7 7"/>',undo:'<path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"/>',redo:'<path d="m15 14 5-5-5-5M20 9H10a6 6 0 0 0 0 12h3"/>',
 upload:'<path d="M12 16V4m0 0L7 9m5-5 5 5M4 20h16"/>',camera:'<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16M3 9h5M3 15h5M16 9h5M16 15h5"/>',
 dup:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'
};
function ico(n){return '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>'}
var TOOLS=[['select','Select','V'],['arrow','Arrow','A'],['line','Line','L'],['pen','Pen','P'],['ring','Ring','R'],['spot','Spotlight','S'],['beam','Beam','B'],['angle','Angle','G'],['text','Caption','T']];
var TYPE_NAME={arrow:'Arrow',line:'Line',pen:'Pen',ring:'Ring',beam:'Beam',angle:'Angle',text:'Caption'};
var COLORS=['#ffffff','#ffd83a','#ff4b3e','#3fdc85','#4db2ff','#ff7ad9'];

/* ---------- state ---------- */
var vid=$('#vid'),cv=$('#cv'),ctx=cv.getContext('2d'),screenEl=$('#screen');
var hasVideo=false,blobUrl=null,dirty=true,lastT=-1,prevTick=0,rafT=0;
var S={tool:'select',color:'#ffd83a',w:4,keep:false,sel:null,vTime:0,vPlaying:false,vRate:1,fps:30,draft:null,drag:null,exporting:false,cancel:false,speed:1};
var P={name:'Demo scene',key:'',anns:[],inT:null,outT:null,hold:3,demo:true};
var undoS=[],redoS=[],lastSnapKey='',lastSnapAt=0,saveTimer=null;

function dur(){return hasVideo&&isFinite(vid.duration)?vid.duration:8}
function now(){return hasVideo?vid.currentTime:S.vTime}
function setTime(t){t=clamp(t,0,dur());if(hasVideo)vid.currentTime=t;else S.vTime=t;dirty=true}
function playing(){return hasVideo?!vid.paused:S.vPlaying}
function pause(){if(hasVideo)vid.pause();else S.vPlaying=false;renderTransport()}
function play(){
  if(hasVideo){var p=vid.play();if(p&&p.catch)p.catch(function(){})}
  else{if(S.vTime>=dur()-.05)S.vTime=P.inT||0;S.vPlaying=true}
  renderTransport();
}
function sel(){return P.anns.filter(function(a){return a.id===S.sel})[0]||null}

/* ---------- history + persistence ---------- */
function snap(key){
  var t=Date.now();if(key&&key===lastSnapKey&&t-lastSnapAt<1500){lastSnapAt=t;return}
  lastSnapKey=key||'';lastSnapAt=t;undoS.push(JSON.stringify({a:P.anns,i:P.inT,o:P.outT}));if(undoS.length>80)undoS.shift();redoS=[];renderHeader();
}
function restoreSnap(js){var o=JSON.parse(js);P.anns=o.a;P.inT=o.i;P.outT=o.o;if(!sel())S.sel=null}
function undo(){if(!undoS.length)return;redoS.push(JSON.stringify({a:P.anns,i:P.inT,o:P.outT}));restoreSnap(undoS.pop());lastSnapKey='';changed(true)}
function redo(){if(!redoS.length)return;undoS.push(JSON.stringify({a:P.anns,i:P.inT,o:P.outT}));restoreSnap(redoS.pop());lastSnapKey='';changed(true)}
function persist(){
  clearTimeout(saveTimer);saveTimer=setTimeout(function(){if(!P.key)return;try{localStorage.setItem(P.key,JSON.stringify({anns:P.anns,inT:P.inT,outT:P.outT,hold:P.hold}))}catch(e){}},250);
}
function changed(structural){dirty=true;persist();renderTimeline();renderHeader();if(structural){renderInspector();renderTransport()}}

/* ---------- annotations ---------- */
function newAnn(type,pts){
  var white=(type==='text'||type==='beam');
  var t0=now(),D=dur();if(D-t0<.4)t0=Math.max(0,D-1);
  return {id:uid(),type:type,pts:pts,color:white?'#ffffff':S.color,w:S.w,fs:15,text:'',start:t0,end:P.hold===0?D:Math.min(D,t0+P.hold),
    fade:true,anim:type!=='text'&&type!=='ring'||type==='ring',pause:false,dash:false,fill:'none',bg:true,follow:false,kfs:[]};
}
function offsetAt(a,t){
  if(!a.follow||!a.kfs.length)return {x:0,y:0};

  if(k[0].t>a.start)k.unshift({t:a.start,dx:0,dy:0});

  catch(e){toast('Saving is not available here. Right-click the preview instead.')}
}

  var vw=hasVideo?vid.videoWidth:1280,vh=hasVideo?vid.videoHeight:720,sc=maxW?Math.min(1,maxW/vw):1;
  return {w:Math.max(2,Math.round(vw*sc/2)*2),h:Math.max(2,Math.round(vh*sc/2)*2)};
}
$('#b-snap').addEventListener('click',function(){
  pause();var z=outSize(1920),c=frameCanvas(z.w,z.h,now()),url=c.toDataURL('image/png'),fname=(P.name||'frame').replace(/\.[^.]+$/,'')+'-frame.png';
  openModal('Snapshot','<img src="'+url+'" alt="Annotated frame"><div class="actions"><button class="btn primary" id="snap-dl" type="button">Save image</button><button class="btn" id="snap-cp" type="button">Copy image</button></div><p class="stat">Copy image puts it on your clipboard so you can paste it straight into a report or email.</p>');
  $('#snap-dl').addEventListener('click',function(){c.toBlob(function(b){if(b)saveFile(b,fname)},'image/png')});
  $('#snap-cp').addEventListener('click',function(){
    c.toBlob(function(b){try{navigator.clipboard.write([new ClipboardItem({'image/png':b})]).then(function(){toast('Image copied')},function(){toast('Copy was blocked. Use Save image instead.')})}catch(e){toast('Copy is not supported here. Use Save image instead.')}},'image/png');
  });
});
$('#b-export').addEventListener('click',openExport);
function dataJSON(){return JSON.stringify({anns:P.anns,inT:P.inT,outT:P.outT,hold:P.hold})}
function openExport(){
  pause();var t0=P.inT||0,t1=P.outT!=null?P.outT:dur();
  openModal('Export',
   '<div><h3>Annotated video</h3><p class="stat" id="x-range">'+(hasVideo?'Renders '+fmt(t0)+' to '+fmt(t1)+' ('+(t1-t0).toFixed(1)+' s) with your annotations burned in. It plays in real time, so keep this tab open and visible.':'Load a video first. The demo scene has nothing to export.')+'</p>'+
   '<div class="actions" style="margin:10px 0"><select class="field" id="x-size" aria-label="Output size"><option value="1920">Up to 1920 wide</option><option value="1280" selected>Up to 1280 wide</option><option value="854">Up to 854 wide</option></select><button class="btn primary" id="x-go" type="button"'+(hasVideo?'':' disabled')+'>Start rendering</button><button class="btn" id="x-cancel" type="button" hidden>Cancel</button></div>'+
   '<div class="prog" id="x-pw" hidden><i id="x-prog"></i></div><p class="stat" id="x-stat"></p><div id="x-res"></div></div>'+
   '<div><h3>Annotation data</h3><p class="stat">Copy this to keep or move your annotations. Paste it back below to restore.</p><textarea id="x-json" readonly>'+esc(dataJSON())+'</textarea><div class="actions" style="margin:8px 0"><button class="btn sm" id="x-copy" type="button">Copy data</button></div><textarea id="x-in" placeholder="Paste data here to restore"></textarea><div class="actions" style="margin-top:8px"><button class="btn sm" id="x-restore" type="button">Restore</button><span class="stat" id="x-rs"></span></div></div>');
  $('#x-go').addEventListener('click',renderVideoOut);
  $('#x-cancel').addEventListener('click',function(){S.cancel=true});
  $('#x-copy').addEventListener('click',function(){var ta=$('#x-json');try{navigator.clipboard.writeText(ta.value).then(function(){toast('Copied')},function(){ta.select();document.execCommand('copy');toast('Copied')})}catch(e){ta.select();try{document.execCommand('copy')}catch(_){}toast('Copied')}});
  $('#x-restore').addEventListener('click',function(){
    try{var j=JSON.parse($('#x-in').value);if(!j||!Array.isArray(j.anns))throw 1;snap();P.anns=j.anns;P.inT=j.inT==null?null:j.inT;P.outT=j.outT==null?null:j.outT;S.sel=null;changed(true);$('#x-rs').textContent='Restored '+P.anns.length+' annotations.'}
    catch(e){$('#x-rs').textContent='That is not valid annotation data.';$('#x-rs').className='stat err'}
  });
}
function pickMime(){
  if(!window.MediaRecorder)return null;
  var list=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];
  for(var i=0;i<list.length;i++){try{if(MediaRecorder.isTypeSupported(list[i]))return list[i]}catch(e){}}return null;
}
function renderVideoOut(){
  var stat=$('#x-stat'),mime=pickMime();
  if(!mime||!HTMLCanvasElement.prototype.captureStream){stat.textContent='This browser cannot record video from the page. Use Chrome, Edge or Safari 14.1+, or take snapshots instead.';stat.className='stat err';return}
  var z=outSize(+$('#x-size').value),oc=document.createElement('canvas');oc.width=z.w;oc.height=z.h;var ox=oc.getContext('2d');
  var t0=P.inT||0,t1=P.outT!=null?P.outT:dur(),stream=oc.captureStream(30),chunks=[],rec;
  try{var as=vid.captureStream?vid.captureStream():(vid.mozCaptureStream?vid.mozCaptureStream():null);if(as)as.getAudioTracks().forEach(function(tr){stream.addTrack(tr)})}catch(e){}
  try{rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:Math.round(z.w*z.h*4)})}catch(e){try{rec=new MediaRecorder(stream)}catch(e2){stat.textContent='Recording could not start in this browser.';stat.className='stat err';return}}
  rec.ondataavailable=function(e){if(e.data&&e.data.size)chunks.push(e.data)};
  S.exporting=true;S.cancel=false;$('#x-go').disabled=true;$('#x-cancel').hidden=false;$('#x-pw').hidden=false;$('#x-res').innerHTML='';stat.className='stat';stat.textContent='Rendering… 0%';
  var done=function(){
    S.exporting=false;$('#x-go').disabled=false;$('#x-cancel').hidden=true;vid.pause();setTime(t0);
    if(S.cancel){stat.textContent='Cancelled.';return}
    var type=(rec.mimeType||mime).split(';')[0],ext=type.indexOf('mp4')>-1?'mp4':'webm',blob=new Blob(chunks,{type:type}),url=URL.createObjectURL(blob),nm=(P.name||'clip').replace(/\.[^.]+$/,'')+'-annotated.'+ext;
    stat.textContent='Done. '+(blob.size/1048576).toFixed(1)+' MB '+ext.toUpperCase()+'.';$('#x-prog').style.width='100%';
    $('#x-res').innerHTML='<video controls playsinline src="'+url+'"></video><div class="actions" style="margin-top:8px"><button class="btn primary" id="x-save" type="button">Save '+ext.toUpperCase()+'</button></div><p class="stat">You will be asked to confirm the file name before it saves.</p>';
    $('#x-save').addEventListener('click',function(){saveFile(blob,nm)});
  };
  rec.onstop=done;
  var seeked=function(){
    vid.removeEventListener('seeked',seeked);vid.playbackRate=1;rec.start(250);var p=vid.play();if(p&&p.catch)p.catch(function(){});
    var loop=function(){
      if(!S.exporting)return;
      var t=vid.currentTime;ox.drawImage(vid,0,0,z.w,z.h);drawAnns(ox,z.w,z.h,t,false);
      var pr=clamp((t-t0)/Math.max(.01,t1-t0),0,1);$('#x-prog').style.width=(pr*100)+'%';stat.textContent='Rendering… '+Math.round(pr*100)+'%';
      if(S.cancel||t>=t1-.03||vid.ended){vid.pause();try{rec.stop()}catch(e){done()}return}
      requestAnimationFrame(loop);
    };requestAnimationFrame(loop);
  };
  vid.addEventListener('seeked',seeked);vid.currentTime=t0;
}
